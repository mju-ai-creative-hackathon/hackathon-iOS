name: Moment
options:
  bundleIdPrefix: com.mju.hackathon
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Moment:
    type: application
    platform: iOS
    sources: [Moment]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mju.hackathon.moment
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 설로그
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "코스 촬영 미션 사진과 영상을 찍기 위해 카메라를 사용해요."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "숏폼을 만들 사진과 영상을 가져오기 위해 사진 보관함에 접근해요."
        INFOPLIST_KEY_NSMotionUsageDescription: "코스를 걷는 동안 걸음수를 기록하기 위해 동작 및 피트니스 정보를 사용해요."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "촬영 미션 영상을 녹화할 때 소리를 함께 담기 위해 마이크를 사용해요."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "코스까지의 거리와 걸은 발자취를 기록하기 위해 위치를 사용해요."
